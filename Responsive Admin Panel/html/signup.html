<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="../css/style.css" rel="stylesheet">
    <script src="../js/script.js"></script>
</head>
<body>
    <div class="wrapper">
        <div class="title-text">
            <div class="title signup">
                Signup Form
            </div>
        </div>
        <div class="form-container">
            <div class="form-inner">
                <form action="#" class="signup">
                    
                    <div class="field">
                        <input type="text" id="uname" placeholder="User Name" required>
                    </div>
                    <div class="field">
                        <input type="text" id="uemail" placeholder="User Email" required>
                    </div>
                    <div class="field">
                        <input type="text" id="umobile" placeholder="User Mobile" required>
                    </div>
                    <div class="field">
                        <input type="text" id="ucity" placeholder="User City" required>
                    </div>
                    <div class="field">
                        <input type="password" id="upassword" placeholder="Password" required>
                    </div>
                    <div class="field">
                        <input type="password" id="ucpassword" placeholder="Confirm password" required>
                    </div>
                    <div class="field btn">
                        <div class="btn-layer"></div>
                        <input type="submit" id="ssubmitBtn" value="Signup" onclick="register()">
                    </div>
                    <div class="signup-link">
                        Already Have You Register? <a href="index.html">Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
