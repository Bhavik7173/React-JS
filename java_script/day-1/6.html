<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function dispData()
        {
            
            var a = document.getElementById("fname").value
            var b = document.getElementById("lname").value
            
            var data = "First NAME : <b>"+a + "</b><br>Second NAME : <b>" +b +"</b>"
            document.getElementById("userdata").innerHTML = data
        }
    </script>
</head>
<body>
    <form>
        <input type="text" placeholder="First Name" id="fname"><br>
        <input type="text" placeholder="Second Name" id="lname"><br>
        <input type="button" value="submit" onclick="dispData()">
    </form>
    <p id="userdata">
    </p>
</body>
</html>
