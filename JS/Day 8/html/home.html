<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="../js/home_script.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
  <!-- <h1>Home Page</h1> -->
  <nav class="navbar bg-light">
    <div class="container-fluid">
      <a class="navbar-brand">E-Commerce</a>
      <form class="d-flex" role="search">
        <input class="form-control me-2" id="searchProduct" type="search" placeholder="Search" aria-label="Search">
        <button class="btn btn-outline-success" type="submit" onclick="serachproduct()">Search</button>
        &nbsp;&nbsp;&nbsp;<a class="navbar-brand">Show Cart Detail</a>
      </form>
    </div>
  </nav>
  <ul class="nav nav-tabs">
    <li class="nav-item">
      <a class="nav-link active" aria-current="page" onclick="openPage('MyAccount')" href="#">My Account</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" onclick="openPage('Product')" href="#">Product Details</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="#" onclick="openPage('Cart')">Cart Details</a>
    </li>
    <li class="nav-item">
      <a class="nav-link enabled" href="#" onclick="openPage('Logout')">Logout</a>
    </li>
  </ul>

  <div id="MyAccount" class="w3-container city">
    <h2>MyAccount</h2>
    <p>London is the capital city of England.</p>
  </div>

  <div id="Product" class="w3-container city" style="display:none">
    <table class="table table-success table-striped" onload="myload()">
      <thead>
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Product ID</th>
          <th scope="col">Product Name</th>
          <th scope="col">Quantity</th>
          <th scope="col">Company</th>
          <th scope="col">Price</th>
          <th scope="col">Offer</th>
          <th scope="col">Edit</th>
          <th scope="col">Delete</th>
          <th scope="col">Add To Cart</th>
        </tr>
      </thead>
      <tbody id="display">

      </tbody>
    </table>
  </div>

  <div id="Cart" class="w3-container city" style="display:none">
    <h2>Tokyo</h2>
    <p>Tokyo is the capital of Japan.</p>
  </div>

  <div id="Logout" class="w3-container city" style="display:none">
    <h2>Logout</h2>
    <button class="btn btn-outline-success" type="submit" onclick="logout()">Logout</button>
        
  </div>

</body>

</html>
