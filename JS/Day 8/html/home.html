<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="../js/home_script.js"></script>
  <link href="../css/homestyle.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
  <!-- <h1>Home Page</h1> -->
  <nav class="navbar bg-light">
    <div class="container-fluid">
      <a class="navbar-brand">E-Commerce</a>
      <form class="d-flex" role="search">
        <input class="form-control me-2" id="searchProduct" type="search" placeholder="Search" aria-label="Search">
        <button class="btn btn-outline-success" type="submit" onclick="serachproduct()">Search</button>
        &nbsp;&nbsp;&nbsp;<a class="navbar-brand">Show Cart Detail</a>
      </form>
    </div>
  </nav>
  <ul class="nav nav-tabs">
    <li class="nav-item">
      <a class="nav-link active" aria-current="page" onclick="openPage('MyAccount')" href="#">My Account</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" onclick="openPage('Product')" href="#">Product Details</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="#" onclick="openPage('Cart')">Cart Details</a>
    </li>
    <li class="nav-item">
      <a class="nav-link enabled" href="#" onclick="openPage('Logout')">Logout</a>
    </li>
  </ul>

  <div id="MyAccount" class="w3-container city" onload="myaccount()">
    <section class="vh-100 gradient-custom">
      <div class="container py-5 h-100">
        <div class="row justify-content-center align-items-center h-100">
          <div class="col-12 col-lg-9 col-xl-7">
            <div class="card shadow-2-strong card-registration" style="border-radius: 15px;">
              <div class="card-body p-4 p-md-5">
                <h3 class="mb-4 pb-2 pb-md-0 mb-md-5">My Account</h3>
                <form>
    
                  <div class="row">
                    <div class="col-md-6 mb-4">
    
                      <div class="form-outline">
                        <input type="text" id="firstName" class="form-control form-control-lg" disabled/>
                        <label class="form-label" for="firstName">User ID</label>
                      </div>
    
                    </div>
                    <div class="col-md-6 mb-4">
    
                      <div class="form-outline">
                        <input type="text" id="lastName" class="form-control form-control-lg" disabled/>
                        <label class="form-label" for="lastName">Full Name</label>
                      </div>
    
                    </div>
                  </div>
    
                  <div class="row">
                    <div class="col-md-6 mb-4 d-flex align-items-center">
    
                      <div class="form-outline">
                        <input type="tel" id="phoneNumber" class="form-control form-control-lg" disabled/>
                        <label class="form-label" for="phoneNumber">Phone Number</label>
                      </div>
    
                    </div>
                    <div class="col-md-6 mb-4">
    
                      <h6 class="mb-2 pb-1">Gender: </h6>
    
                      <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="inlineRadioOptions" id="femaleGender"
                          value="option1"/>
                        <label class="form-check-label" for="femaleGender" >Female</label>
                      </div>
    
                      <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="inlineRadioOptions" id="maleGender"
                          value="option2"/>
                        <label class="form-check-label" for="maleGender">Male</label>
                      </div>
    
                      <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="inlineRadioOptions" id="otherGender"
                          value="option3"/>
                        <label class="form-check-label" for="otherGender">Other</label>
                      </div>
    
                    </div>
                  </div>
    
                  <div class="row">
                    <div class="col-md-6 mb-4 pb-2">
    
                      <div class="form-outline">
                        <input type="email" id="emailAddress" class="form-control form-control-lg" disabled/>
                        <label class="form-label" for="emailAddress">Email</label>
                      </div>
    
                    </div>
                    <div class="col-md-6 mb-4 pb-2">
    
                      <div class="form-outline">
                        <input type="password" id="password" class="form-control form-control-lg " disabled/>
                        <label class="form-label" for="password">Password</label>
                      </div>
    
                    </div>
                  </div>
    
                  <div class="row">
                    <div class="col-12">
    
                      <select class="select form-control-lg" id="city" >
                        <option value="1" disabled>Choose City</option>
                        <option value="2">Surat</option>
                        <option value="3">Ahmedabad</option>
                        <option value="4">Vadodara</option>
                        <option value="5">Mahesana</option>
                        <option value="6">Valsad</option>
                        <option value="7">Vapi</option>
                        <option value="8">Gandhinagar</option>
                      </select>
                      <label class="form-label select-label" id="city_label" >Choose City</label>
    
                    </div>
                  </div>
    
                  <div class="mt-4 pt-2">
                    <input class="btn btn-primary btn-lg" type="submit" value="Edit" />
                  </div>
    
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div id="Product" class="w3-container city" style="display:none">
    <table class="table table-success table-striped" onload="myload()">
      <thead>
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Product ID</th>
          <th scope="col">Product Name</th>
          <th scope="col">Quantity</th>
          <th scope="col">Company</th>
          <th scope="col">Price</th>
          <th scope="col">Offer</th>
          <th scope="col">Edit</th>
          <th scope="col">Delete</th>
          <th scope="col">Add To Cart</th>
        </tr>
      </thead>
      <tbody id="display">

      </tbody>
    </table>
  </div>

  <div id="Cart" class="w3-container city" style="display:none">
    <h2>Tokyo</h2>
    <p>Tokyo is the capital of Japan.</p>
  </div>

  <div id="Logout" class="w3-container city" style="display:none">
    <h2>Logout</h2>
    <button class="btn btn-outline-success" type="submit" onclick="logout()">Logout</button>
        
  </div>

</body>

</html>
