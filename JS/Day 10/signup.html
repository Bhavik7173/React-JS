<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <script src="js/users.js"></script>
</head>
<body>
    <h1>Register new user</h1>
    <center>
        <input type="number" placeholder="Enter User ID" id="userId" required/> <br>
        <input type="text" placeholder="Enter User Name" id="userName" required/> <br>
        <input type="email" placeholder="Enter User Email" id="userEmail" required/> <br>
        <input type="password" placeholder="Enter user Password" id="userPass" required/> <br>
        <input type="number" placeholder="Enter user Contact Number" id="userMobile" required/> <br>
        <input type="text" placeholder="Enter user City" id="userCity" required/> <br>

        <input type="button" value="Register" onclick="register()"> <br>
        <a href="index.html"> Already Registered ?></a>
    </center>
</body>
</html>
