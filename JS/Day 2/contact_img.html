<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title>My Contact</title>
    <style>
        input {
            padding: 5px;
        }

        th {
            background-color: brown;
            font-size: 20px;
            color: aliceblue;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
    <script>
        // let contact = []
        let falg = -1
        let contact = [
            { 'name': 'aaa', 'email': 'a@gmail', 'contact': 111 },
            { 'name': 'bbb', 'email': 'b@gmail', 'contact': 222 },
            { 'name': 'ccc', 'email': 'c@gmail', 'contact': 333 },
            { 'name': 'ddd', 'email': 'd@gmail', 'contact': 444 },
            { 'name': 'eee', 'email': 'e@gmail', 'contact': 555 }
        ];
        function getContact() {
            let name = nameElement.value
            let email = emailElement.value
            let phone = contactElement.value

            let temp = []
            temp['name'] = name
            temp['email'] = email
            temp['contact'] = phone
            return temp;
        }
        function addContact() {

            let temp = getContact();
            if (falg != -1) {
                contact[falg] = temp
                falg = -1
                addButton.value = "Add Contact"
            }
            else {
                contact.push(temp)
            }
            console.log(contact)
            dispData();
            resetField();
        }
        function dispData() {
            let output = "<table border=3 cellpadding='10px' align='center'>";
            output += "<tr>";
            output += "<th>Name</th>";
            output += "<th>Email</th>";
            output += "<th>Contact</th>";
            output += "<th>Update</th>";
            output += "<th>Delete</th>";
            output += "</tr>";
            for (let i = 0; i < contact.length; i++) {
                output += "<tr>";
                output += "<td>" + contact[i].name + "</td>"
                output += "<td>" + contact[i].email + "</td>"
                output += "<td>" + contact[i].contact + "</td>"
                output += "<td> <a href='#' onclick=updateContact(" + i + ")><i class='material-icons' style='font-size:30px'>edit</i></a> </td>"
                output += "<td> <a href='#' onclick=deleteContact(" + i + ")><i class='material-icons' style='font-size:30px'>delete</i></a> </td>"

                output += "</tr>";
            }
            output += "</table>"
            document.getElementById("display").innerHTML = output
        }
        function resetField() {
            nameElement.value = ""
            emailElement.value = ""
            contactElement.value = ""
        }

        function deleteContact(index) {
            let ans = confirm("Do you want to delete this record?")
            if (ans == true) {
                contact.splice(index, 1);
                resetField()
                dispData()
                alert("Delete Record");
            }
            else { }
        }

        function updateContact(index) {
            falg = index;
            let tempContact = contact[index]
            setContact(tempContact)
        }

        function setContact(tempContact) {
            nameElement.value = tempContact['name']
            emailElement.value = tempContact['email']
            contactElement.value = tempContact['contact']

            addButton.value = "Update Contact"
            falg = 1
        }
    </script>
</head>

<body align="center">
    <h1>Contact Application</h1>
    <input type="text" placeholder="Enter the User Name" id="uname">
    <br>
    <br>
    <input type="text" placeholder="Enter the User Email" id="uemail">
    <br>
    <br>
    <input type="text" placeholder="Enter the User Contact" id="uphone">
    <br>
    <br>
    <input type="submit" value="Add Contact" onclick="addContact()" id="addBtn">
    <br>
    <br>
    <div id="display">

    </div>
    <script>
        let nameElement = document.getElementById("uname");
        let emailElement = document.getElementById("uemail");
        let contactElement = document.getElementById("uphone");
        let addButton = document.getElementById("addBtn");
    </script>
</body>

</html>
