<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title>My Contact</title>
    <style>
        input {
            padding: 5px;
        }

        th {
            background-color: brown;
            font-size: 20px;
            color: aliceblue;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
    <script>
        let contact = []
        function addContact() {
            let name = document.getElementById("uname").value
            let email = document.getElementById("uemail").value
            let phone = document.getElementById("uphone").value

            let temp = []
            temp['name'] = name
            temp['email'] = email
            temp['contact'] = phone
            contact.push(temp)
            console.log(contact)
            dispData();
            resetField();
        }
        function dispData() {
            let output = "<table border=3 cellpadding='10px' align='center'>";
            output += "<tr>";
            output += "<th>Name</th>";
            output += "<th>Email</th>";
            output += "<th>Contact</th>";
            output += "<th>Update</th>";
            output += "<th>Delete</th>";
            output += "</tr>";
            for (let i = 0; i < contact.length; i++) {
                output += "<tr>";
                output += "<td>" + contact[i].name + "</td>"
                output += "<td>" + contact[i].email + "</td>"
                output += "<td>" + contact[i].contact + "</td>"
                output += "<td> <a href='#'><i class='material-icons' style='font-size:30px'>edit</i></a> </td>"
                output += "<td> <a href='#'><i class='material-icons' style='font-size:30px'>delete</i></a> </td>"
                
                output += "</tr>";
            }
            output += "</table>"
            document.getElementById("display").innerHTML = output
        }
        function resetField() {
            document.getElementById("uname").value = ""
            document.getElementById("uemail").value = ""
            document.getElementById("uphone").value = ""
        }
    </script>
</head>

<body align="center">
    <h1>Contact Application</h1>
    <input type="text" placeholder="Enter the User Name" id="uname">
    <br>
    <br>
    <input type="text" placeholder="Enter the User Email" id="uemail">
    <br>
    <br>
    <input type="text" placeholder="Enter the User Contact" id="uphone">
    <br>
    <br>
    <input type="submit" value="Add Contact" onclick="addContact()">
    <br>
    <br>
    <div id="display">

    </div>
</body>

</html>
